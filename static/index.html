<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rag-qa</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 760px;
         margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.5; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  p.sub { color: #888; margin-top: 0; font-size: .9rem; }
  form { display: flex; gap: .5rem; margin: 1.25rem 0; }
  input { flex: 1; padding: .6rem .75rem; font-size: 1rem; border: 1px solid #999;
          border-radius: 8px; background: transparent; color: inherit; }
  button { padding: .6rem 1.1rem; font-size: 1rem; border: 0; border-radius: 8px;
           background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #answer { white-space: pre-wrap; padding: 1rem; border: 1px solid #444;
            border-radius: 8px; min-height: 2rem; }
  #sources { margin-top: 1rem; font-size: .85rem; color: #888; }
  #sources li { margin: .15rem 0; }
  .muted { color: #888; }
</style>
</head>
<body>
  <h1>rag-qa</h1>
  <p class="sub">Ask a question about the ingested documents. Answers are grounded in retrieved chunks.</p>

  <form id="ask-form">
    <input id="q" type="text" placeholder="What does the document say about...?" autocomplete="off" required>
    <button id="submit" type="submit">Ask</button>
  </form>

  <div id="answer" class="muted">Answers appear here.</div>
  <ul id="sources"></ul>

<script>
const form = document.getElementById('ask-form');
const qEl = document.getElementById('q');
const btn = document.getElementById('submit');
const ansEl = document.getElementById('answer');
const srcEl = document.getElementById('sources');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = qEl.value.trim();
  if (!question) return;
  btn.disabled = true;
  ansEl.className = 'muted';
  ansEl.textContent = 'Thinking...';
  srcEl.innerHTML = '';
  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || ('HTTP ' + res.status));
    }
    const data = await res.json();
    ansEl.className = '';
    ansEl.textContent = data.answer || '(no answer)';
    if (Array.isArray(data.sources) && data.sources.length) {
      srcEl.innerHTML = '<strong>Sources</strong>';
      for (const s of data.sources) {
        const li = document.createElement('li');
        const src = s.source || 'unknown';
        li.textContent = s.page != null ? `${src} (p. ${s.page})` : src;
        srcEl.appendChild(li);
      }
    }
  } catch (err) {
    ansEl.className = '';
    ansEl.textContent = 'Error: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
